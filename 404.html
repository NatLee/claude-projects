<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>找不到這顆星 · 每日小專案</title>
<style>
  html{background:#0b0e1a}
  body{
    margin:0; min-height:100vh; display:grid; place-items:center;
    font-family:-apple-system,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;
    color:#dfe3f2; text-align:center; padding:2rem; box-sizing:border-box;
  }
  .star{font-size:2.2rem; opacity:.9}
  h1{font-size:1.3rem; font-weight:600; margin:.8rem 0 .4rem}
  p{color:#8b92ad; margin:.3rem 0 1.4rem; line-height:1.8}
  a{
    color:#0b0e1a; background:#e8c96a; text-decoration:none; font-weight:600;
    padding:.55rem 1.3rem; border-radius:99px; display:inline-block;
  }
  a:focus-visible{outline:2px solid #e8c96a; outline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="star" aria-hidden="true">☄</div>
  <h1>這片天區找不到這顆星</h1>
  <p>連結可能被截斷了——中文網址在聊天軟體裡常常斷在半路。</p>
  <a id="home" href="/claude-projects/">回到整片星空</a>
</main>
<script>
  // GitHub Pages 專案站的根目錄是 /<repo>/：從失敗的路徑推回第一段，
  // 改倉庫名也指得回首頁；自訂網域（非 *.github.io）則一律回根目錄。
  (function () {
    var seg = /\.github\.io$/.test(location.hostname) ? location.pathname.split('/')[1] : '';
    document.getElementById('home').href = seg ? '/' + seg + '/' : '/';
  })();
</script>
</body>
</html>
